name: modelbox-bump

on:
  schedule:
    - cron: "0 4 * * *"   # daily 04:00 UTC
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Read pinned commit from YAML
        id: pin
        run: |
          PINNED=$(python3 -c "
          import yaml
          d = yaml.safe_load(open('tools/modelbox-flowunits.yml'))
          print(d['modelbox_commit'])
          ")
          echo "sha=$PINNED" >> "$GITHUB_OUTPUT"

      - name: Clone upstream modelbox
        run: |
          git clone --depth=200 https://github.com/modelbox-ai/modelbox.git /tmp/modelbox-upstream

      - name: Get upstream HEAD SHA and date
        id: upstream
        run: |
          SHA=$(git -C /tmp/modelbox-upstream rev-parse HEAD)
          DATE=$(git -C /tmp/modelbox-upstream log -1 --format=%cs)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Check if bump needed
        id: check
        run: |
          if [ "${{ steps.upstream.outputs.sha }}" = "${{ steps.pin.outputs.sha }}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Pinned commit is already up to date — no-op."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "New upstream SHA: ${{ steps.upstream.outputs.sha }}"
          fi

      - name: Update pinned commit in YAML
        if: steps.check.outputs.needed == 'true'
        run: |
          python3 - <<'PYEOF'
          import yaml
          from pathlib import Path

          p = Path("tools/modelbox-flowunits.yml")
          d = yaml.safe_load(p.read_text())
          d["modelbox_commit"] = "${{ steps.upstream.outputs.sha }}"
          d["modelbox_commit_date"] = "${{ steps.upstream.outputs.date }}"
          p.write_text(yaml.dump(d, default_flow_style=False, allow_unicode=True, sort_keys=False))
          PYEOF

      - name: Run generator
        if: steps.check.outputs.needed == 'true'
        run: |
          python3 tools/build-modelbox-skill.py \
            --modelbox-repo /tmp/modelbox-upstream \
            --commit "${{ steps.upstream.outputs.sha }}" \
            --out skills/modelbox/

      - name: Run linter / validator
        if: steps.check.outputs.needed == 'true'
        run: python3 tools/test-modelbox-skill.py skills/modelbox/

      - name: Compute diff summary
        if: steps.check.outputs.needed == 'true'
        id: diff
        run: |
          SUMMARY=$(git diff --stat skills/modelbox/ tools/modelbox-flowunits.yml 2>/dev/null || echo "(no diff)")
          echo "summary<<__EOF__" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "__EOF__" >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_SHA: ${{ steps.upstream.outputs.sha }}
          NEW_DATE: ${{ steps.upstream.outputs.date }}
          DIFF_SUMMARY: ${{ steps.diff.outputs.summary }}
        run: |
          SHORT="${NEW_SHA:0:8}"
          BRANCH="automation/modelbox-bump-${SHORT}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
          git add skills/modelbox/ tools/modelbox-flowunits.yml
          git commit -m "chore(modelbox): bump pin to ${SHORT} (${NEW_DATE})"
          git push origin "$BRANCH" --force

          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          PR_BODY="## modelbox bump to \`${SHORT}\` (${NEW_DATE})

          ### Changed files

          \`\`\`
          ${DIFF_SUMMARY}
          \`\`\`

          ### Notes

          - Auto-generated by \`modelbox-bump\` workflow.
          - If a flowunit disappeared upstream (MISSING marker in linter), this PR will not exist — the job fails instead. Manually update \`tools/modelbox-flowunits.yml\`.
          - Review and merge; do NOT auto-merge (human review required).
          "

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body "$PR_BODY"
            echo "Updated existing PR #${EXISTING}"
          else
            gh pr create \
              --title "chore(modelbox): bump pin to ${SHORT}" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH" \
              --label "automation"
            echo "Opened new PR for branch ${BRANCH}"
          fi
